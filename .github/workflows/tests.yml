name: tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: pytest (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history lets SonarCloud attribute new code correctly

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run tests with coverage
        run: >
          pytest -q
          --cov=frontier_atlas --cov-report=term --cov-report=xml:coverage.xml
          --junitxml=reports/junit.xml

      - name: Upload test and coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports-py${{ matrix.python }}
          path: |
            coverage.xml
            reports/

      # Runs only when a SONAR_TOKEN secret is configured (free for public repos on sonarcloud.io).
      - name: SonarCloud scan
        if: matrix.python == '3.12' && env.SONAR_TOKEN != ''
        uses: SonarSource/sonarqube-scan-action@v5
        env:
          SONAR_HOST_URL: https://sonarcloud.io
